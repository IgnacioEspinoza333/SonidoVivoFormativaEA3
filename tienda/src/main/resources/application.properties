spring.application.name=tienda
server.port=8081
# --- http://localhost:8081/swagger-ui/index.html

# --- MySQL (XAMPP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_sonido_vivo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


spring.flyway.baseline-on-migrate=true